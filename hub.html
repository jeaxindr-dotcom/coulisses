<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coulisses</title>
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Coulisses (formerly « Brambleshire Studio ») — home screen of the app: the episodes and the imported projects, open one in the review studio
     (same « glass » design). « Importer un projet… » works like DaVinci Resolve's Project Manager: a folder (an AItelier
     run, a folder of videos) or a video file joins the list; removing it from the list deletes nothing. -->
<style>
  :root {
    --s12: #f4f5fa; --s11: #aeb2c4; --s9: #6f748a; --stroke: rgba(255,255,255,.075); --stroke-2: rgba(255,255,255,.14);
    --lime: #c9f26b; --mint: #6fe7c8; --violet: #b49cff; --sky: #8fcdff; --coral: #ff8f7e; --amber: #ffd27f;
    --grad-lime: linear-gradient(135deg, #dcf77a 0%, #9dee9a 48%, #6fe2c9 100%);
    --font: "Inter", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; --font-d: "Outfit", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; color: var(--s12); font: 13.5px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
  body { background:
      radial-gradient(900px 620px at 8% -8%, rgba(140,110,255,.30), transparent 62%),
      radial-gradient(760px 560px at 102% 12%, rgba(90,210,255,.16), transparent 60%),
      radial-gradient(900px 640px at 70% 118%, rgba(110,231,200,.18), transparent 60%),
      radial-gradient(700px 500px at -6% 96%, rgba(247,168,207,.12), transparent 60%), #090b12; background-attachment: fixed; }
  header { display: flex; align-items: center; gap: 14px; padding: 26px 40px 6px; }
  .logo { width: 44px; height: 44px; border-radius: 14px; background: var(--grad-lime); display: grid; place-items: center; color: #10140a; font: 700 22px var(--font-d); box-shadow: 0 10px 28px rgba(150,230,140,.28); }
  h1 { margin: 0; font: 600 26px var(--font-d); letter-spacing: .005em; }
  .sub { color: var(--s9); font-size: 13px; }
  header .grow { flex: 1; }
  .pill { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px; border-radius: 999px; background: rgba(24,27,40,.58); backdrop-filter: blur(20px); border: 1px solid var(--stroke); color: var(--s11); font: 500 12.5px var(--font-d); }
  .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 10px var(--lime); }
  main { padding: 18px 40px 50px; }
  h2 { font: 600 15px var(--font-d); color: var(--s11); margin: 8px 4px 16px; letter-spacing: .02em; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 18px; }
  .card { position: relative; border-radius: 24px; overflow: hidden; background: rgba(24,27,40,.58); backdrop-filter: blur(26px) saturate(160%); border: 1px solid var(--stroke);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 24px 60px rgba(0,0,0,.35); cursor: pointer; transition: transform .18s, border-color .18s, box-shadow .18s; }
  .card:hover { transform: translateY(-3px); border-color: rgba(201,242,107,.45); box-shadow: 0 0 0 4px rgba(201,242,107,.06), 0 30px 70px rgba(0,0,0,.45); }
  .card.off { cursor: default; opacity: .55; } .card.off:hover { transform: none; border-color: var(--stroke); }
  .thumb { aspect-ratio: 16 / 9; background: #000 center / cover no-repeat; position: relative; }
  .thumb::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 55%, rgba(9,11,18,.75)); }
  .id { position: absolute; left: 14px; top: 14px; z-index: 1; height: 26px; padding: 0 11px; border-radius: 999px; display: inline-flex; align-items: center; background: rgba(9,11,18,.6); backdrop-filter: blur(10px); font: 600 12px var(--font-d); border: 1px solid var(--stroke-2); }
  .live { position: absolute; right: 14px; top: 14px; z-index: 1; height: 26px; padding: 0 11px; border-radius: 999px; display: inline-flex; align-items: center; gap: 7px; background: var(--lime); color: #10140a; font: 600 11.5px var(--font-d); }
  .body { padding: 16px 18px 18px; }
  .title { font: 600 19px var(--font-d); margin: 0 0 4px; }
  .meta { color: var(--s9); font-size: 12.5px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
  .chip { height: 24px; padding: 0 10px; border-radius: 999px; display: inline-flex; align-items: center; font: 600 11.5px var(--font-d); background: rgba(255,255,255,.08); color: var(--s11); }
  .chip.open { background: rgba(255,143,126,.15); color: var(--coral); }
  .chip.ok { background: rgba(111,231,200,.14); color: var(--mint); }
  .chip.draft { background: rgba(180,156,255,.16); color: #c9bdff; }
  .chip.render { background: var(--grad-lime); color: #10140a; }
  .chip.renderbad { background: rgba(255,143,126,.15); color: var(--coral); }
  .row { display: flex; align-items: center; margin-top: 16px; gap: 10px; }
  .row .grow { flex: 1; }
  button { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 20px; border: 0; border-radius: 999px; background: var(--grad-lime); color: #10140a; font: 600 13.5px var(--font-d); cursor: pointer; box-shadow: 0 10px 28px rgba(150,230,140,.22); }
  button:hover { filter: brightness(1.06); }
  button:disabled { opacity: .6; cursor: default; }
  .spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(16,20,10,.25); border-top-color: #10140a; animation: r .8s linear infinite; }
  @keyframes r { to { transform: rotate(360deg); } }
  .err { color: var(--coral); font-size: 12.5px; margin-top: 10px; white-space: pre-wrap; }
  .empty { color: var(--s9); padding: 60px 0; text-align: center; }
  footer { color: var(--s9); font-size: 12px; padding: 0 44px 30px; }
  h2 { display: flex; align-items: center; gap: 10px; }
  h2 .n { font: 600 11px var(--font-d); color: var(--s9); }
  section + section { margin-top: 34px; }
  .kind { position: absolute; left: 14px; bottom: 12px; z-index: 1; height: 24px; padding: 0 10px; border-radius: 999px; display: inline-flex; align-items: center; background: rgba(9,11,18,.62); backdrop-filter: blur(10px); font: 600 11px var(--font-d); color: var(--sky); border: 1px solid var(--stroke-2); }
  .card .more { height: 32px; padding: 0 14px; border-radius: 999px; background: rgba(255,255,255,.06); color: var(--s11); box-shadow: none; font: 500 12px var(--font-d); border: 1px solid var(--stroke); }
  .card .more:hover { color: var(--coral); border-color: rgba(255,143,126,.35); background: rgba(255,143,126,.1); filter: none; }
  .card .body { position: relative; }
  .imp { border: 1.5px dashed rgba(201,242,107,.35); background: rgba(24,27,40,.35); cursor: default; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 26px 22px; min-height: 300px; gap: 10px; }
  .imp:hover { transform: none; border-color: rgba(201,242,107,.6); }
  .imp .plus { width: 54px; height: 54px; border-radius: 18px; display: grid; place-items: center; background: var(--grad-lime); color: #10140a; font: 600 30px/1 var(--font-d); box-shadow: 0 12px 30px rgba(150,230,140,.25); }
  .imp .t { font: 600 18px var(--font-d); }
  .imp .d { color: var(--s9); font-size: 12.5px; max-width: 300px; }
  .imp .btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 6px; }
  .imp .btns button.soft { background: rgba(255,255,255,.08); color: var(--s12); box-shadow: none; border: 1px solid var(--stroke-2); }
  .imp .paste { display: none; gap: 6px; width: 100%; margin-top: 4px; }
  .imp.pasting .paste { display: flex; }
  .imp .paste input { flex: 1; min-width: 0; height: 38px; border-radius: 999px; border: 1px solid var(--stroke-2); background: rgba(0,0,0,.3); color: var(--s12); padding: 0 14px; font: 12.5px var(--font); }
  .imp a { color: var(--s9); font-size: 12px; cursor: pointer; text-decoration: underline dotted; }
  .imp .err { max-width: 320px; }
  /* « Langue · Language »: the app's language, for the user (settings.json) */
  .langs { display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px; background: rgba(24,27,40,.58); backdrop-filter: blur(20px); border: 1px solid var(--stroke); }
  .langs button { height: 26px; padding: 0 11px; border-radius: 999px; background: transparent; color: var(--s11); box-shadow: none; font: 600 11.5px var(--font-d); }
  .langs button.on { background: #f4f5fa; color: #11131c; }
  .langs button:disabled { opacity: .5; }
  body > #menubar { position: sticky; top: 0; }
</style>
<!--I18N-->
</head>
<body>
<nav id="menubar"></nav>
<header>
  <span class="logo">C</span>
  <div><h1>Coulisses</h1><div class="sub">{{hub.sub}}</div></div>
  <span class="grow"></span>
  <span class="langs" id="langs" title="Langue · Language"><button data-l="fr">FR</button><button data-l="en">EN</button></span>
  <span class="pill" id="where"><span class="dot"></span>{{hub.where}}</span>
</header>
<main>
  <section><h2>Brambleshire Theatre</h2>
  <div class="grid" id="grid"><div class="empty">{{hub.loading}}</div></div></section>
  <section><h2>{{hub.imported}} <span class="n" id="nproj"></span></h2>
  <div class="grid" id="pgrid"></div></section>
</main>
<footer id="foot"></footer>
<script src="/menubar.js"></script>
<script>
(() => {
  const $ = (s) => document.querySelector(s);
  // the texts of this page, in the user's language (window.T, given by hub-server.mjs: lib/i18n.mjs)
  const I18N = window.__I18N ?? { lang: 'fr', dict: {} }, LANG = I18N.lang, T = window.T ?? ((k) => k);
  const LOC = LANG === 'fr' ? [] : 'en-US', TLOC = LANG === 'fr' ? [] : 'en-GB';   // French: the browser's own formats, as before
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const dur = (s) => (s ? `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, '0')}` : '');
  const day = (iso) => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString(LOC, { day: '2-digit', month: 'short' }) + ' ' + d.toLocaleTimeString(TLOC, { hour: '2-digit', minute: '2-digit' }); };
  let busy = null, last = '';
  const KIND = { aitelier: 'AItelier', folder: T('hub.kind.folder'), video: T('hub.kind.video'), remotion: 'Remotion', run: 'Run' };
  // a run of a Remotion pipeline (.coulisses) opens on its code, before any export
  const openable = (e) => !e.missing && (!!e.video || e.kind === 'remotion');
  const kindOf = (e) => (e.kind === 'run' ? (e.channel || 'Run') : e.kind === 'remotion' ? `${e.channel || 'Remotion'}${e.video ? '' : T('hub.liveCode')}` : e.kind === 'aitelier' ? `AItelier${e.format ? ' · ' + (e.format === 'short' ? 'Short' : T('hub.long')) : ''}` : KIND[e.kind] ?? T('hub.kind.project'));
  function chipsOf(e) {
    const R = e.render;
    return [
      R ? (R.state === 'running' ? `<span class="chip render">${R.pct != null ? T('hub.chip.renderPct', { pct: R.pct }) : R.phase === 'checks' ? T('hub.chip.checks') : R.phase === 'finish' ? T('hub.chip.finish') : T('hub.chip.preparing')}</span>`
        : R.state === 'rendered' ? `<span class="chip render">${T('hub.chip.ready')}</span>` : `<span class="chip renderbad">${R.state === 'blocked' ? T('hub.chip.blocked') : T('hub.chip.failed')}</span>`) : '',
      e.notes ? `<span class="chip">${T('hub.chip.notes', { n: e.notes })}</span>` : '',
      e.open ? `<span class="chip open">${T('hub.chip.open', { n: e.open })}</span>` : (e.notes ? `<span class="chip ok">${T('hub.chip.allFixed')}</span>` : ''),
      e.drafts ? `<span class="chip draft">${T('hub.chip.drafts', { n: e.drafts })}</span>` : '',
      e.lots ? `<span class="chip">${T('hub.chip.lots', { n: e.lots })}</span>` : '',
    ].join('');
  }
  function card(e) {
    const c = document.createElement('div'); c.className = 'card' + (openable(e) ? '' : ' off'); c.dataset.id = e.id;
    const what = e.project ? (e.video ? T('hub.exported', { day: esc(day(e.video.mtime)) }) : e.missing ? T('hub.missingFolder') : e.kind === 'remotion' ? T('hub.notExported') : e.kind === 'run' ? T('hub.waitingExport') : T('hub.noVideo')) : (e.video ? T('hub.rendered', { day: esc(day(e.video.mtime)) }) : T('hub.notRendered'));
    c.innerHTML = `<div class="thumb" style="${e.thumb ? `background-image:url('/thumb/${e.id}?v=${encodeURIComponent(e.video?.mtime ?? '')}')` : ''}"><span class="id">${esc(e.project ? (e.missing ? T('hub.badge.missing') : T('hub.badge.project')) : e.id)}</span>${e.studio && !e.studio.paused ? `<span class="live">${T('hub.badge.open')}</span>` : ''}${e.project && !e.missing ? `<span class="kind">${esc(kindOf(e))}</span>` : ''}</div>
      <div class="body"><div class="title">${esc(e.title)}</div>
        <div class="meta">${[e.video ? dur(e.duration) : '', what, e.reviewed ? T('hub.reviewed', { day: esc(day(e.reviewed)) }) : ''].filter(Boolean).join(' · ')}</div>
        ${e.project ? `<div class="meta" title="${esc(e.root ?? e.revue)}" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(e.root ?? e.why ?? '')}</div>` : ''}
        <div class="chips">${chipsOf(e)}</div>
        <div class="row">${e.project ? `<button class="more" title="${esc(T('hub.removeTitle'))}">${T('hub.remove')}</button>` : ''}<span class="grow"></span><button class="open" ${openable(e) ? '' : 'disabled'}>${T('hub.openStudio')}</button></div>
        <div class="err"></div></div>`;
    c.addEventListener('click', (ev) => { if (!ev.target.closest('.more')) openEp(e, c); });
    c.querySelector('.more')?.addEventListener('click', async (ev) => {
      ev.stopPropagation();
      if (!confirm(T('hub.removeConfirm', { title: e.title, revue: e.revue }))) return;
      await fetch('/api/remove?ep=' + e.id, { method: 'POST' }); last = ''; load(true);
    });
    return c;
  }
  // « Importer un projet » : the Windows dialog (a folder, or a video), or a pasted path
  function importCard() {
    const c = document.createElement('div'); c.className = 'card imp';
    c.innerHTML = `<div class="plus">+</div><div class="t">${T('hub.import.title')}</div>
      <div class="d">${T('hub.import.what')}</div>
      <div class="btns"><button id="impFolder">${T('hub.import.folder')}</button><button class="soft" id="impVideo">${T('hub.import.video')}</button></div>
      <a id="impPaste">${T('hub.import.paste')}</a>
      <div class="paste"><input id="impPath" placeholder="${esc(T('hub.import.placeholder'))}" spellcheck="false"><button id="impGo">${T('hub.import.go')}</button></div>
      <div class="err" id="impErr"></div>`;
    const err = (m) => { c.querySelector('#impErr').textContent = m || ''; };
    const doImport = async (p) => {
      err('');
      const r = await (await fetch('/api/import', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: p }) })).json().catch(() => null);
      if (!r?.ok) { err(r?.why ?? T('hub.import.failed')); return; }
      last = ''; await load(true);
      const el = document.querySelector(`.card[data-id="${r.project.id}"]`); el?.scrollIntoView({ behavior: 'smooth', block: 'center' }); el?.animate([{ boxShadow: '0 0 0 4px rgba(201,242,107,.5)' }, { boxShadow: '0 0 0 0 rgba(201,242,107,0)' }], { duration: 1600 });
    };
    const pickAnd = async (what, b) => {
      err(''); const t = b.textContent; b.disabled = true; b.innerHTML = `<span class="spin"></span>${T('hub.import.dialogOpen')}`;
      try {
        const r = await (await fetch('/api/import/pick', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ what }) })).json();
        if (r.ok) await doImport(r.path); else if (!r.cancelled) err(r.why ?? T('hub.import.noDialog'));
      } catch { err(T('hub.import.noDialog')); }
      b.disabled = false; b.textContent = t;
    };
    c.querySelector('#impFolder').onclick = (e) => pickAnd('folder', e.currentTarget);
    c.querySelector('#impVideo').onclick = (e) => pickAnd('video', e.currentTarget);
    c.querySelector('#impPaste').onclick = () => { c.classList.add('pasting'); c.querySelector('#impPath').focus(); };
    const go = () => { const v = c.querySelector('#impPath').value.trim(); if (v) doImport(v); };
    c.querySelector('#impGo').onclick = go;
    c.querySelector('#impPath').addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
    return c;
  }
  async function openEp(e, card) {
    if (busy || !openable(e)) return;
    busy = e.id;
    const b = card.querySelector('button.open'); b.disabled = true; b.innerHTML = `<span class="spin"></span>${T('hub.opening')}`;
    try {
      const r = await (await fetch('/api/open?ep=' + e.id, { method: 'POST' })).json();
      if (!r.ok) throw new Error(r.why || T('hub.error'));
      location.href = r.url;
    } catch (err) { busy = null; b.disabled = false; b.textContent = T('hub.retry'); card.querySelector('.err').textContent = err.message; }
  }
  let timer = null, impCard = null;
  async function load(once) {
    try {
      const r = await (await fetch('/api/episodes', { cache: 'no-store' })).json();
      const sig = JSON.stringify(r);
      if (sig !== last) {
        last = sig;
        $('#where').innerHTML = `<span class="dot"></span>${r.installed ? T('hub.wherePipeline') : T('hub.whereWorkshop')}`;
        $('#foot').textContent = r.episodesDir;
        const pg = $('#pgrid'), keep = document.activeElement?.closest?.('.imp');
        impCard ??= importCard();
        [...pg.children].forEach((x) => { if (x !== impCard) x.remove(); });
        if (!pg.contains(impCard)) pg.appendChild(impCard);
        for (const p of r.projects ?? []) pg.insertBefore(card(p), impCard);
        $('#nproj').textContent = r.projects?.length ? String(r.projects.length) : '';
        if (keep) keep.querySelector('input')?.focus();
        const grid = $('#grid'); grid.innerHTML = '';
        if (!r.episodes.length) grid.innerHTML = `<div class="empty">${T('hub.noEpisode')}</div>`;
        for (const e of r.episodes) {
          grid.appendChild(card(e));
        }
      }
    } catch { /* the hub restarts: retried */ }
    if (!once) { clearTimeout(timer); timer = setTimeout(load, 5000); }
  }
  // « Langue · Language »: kept for the user (settings.json), the page comes back in the new language
  async function setLanguage(l) {
    if (l === LANG) return;
    const r = await (await fetch('/api/lang', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ lang: l }) })).json().catch(() => null);
    if (r?.ok) location.reload();
  }
  for (const b of document.querySelectorAll('#langs button')) {
    b.classList.toggle('on', b.dataset.l === LANG);
    if (I18N.source === 'env') { b.disabled = true; b.title = 'COULISSES_LANG'; }
    b.onclick = () => setLanguage(b.dataset.l);
  }

  // ---------- the menu bar (menubar.js): the same four menus as the studio; what needs a studio is greyed, with why ----------
  const postJSON = (u, b) => fetch(u, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(b ?? {}) }).then((r) => r.json()).catch(() => null);
  const dlg = (o) => window.MenuBar?.dialog({ buttons: [{ label: T('menu.dlg.close'), primary: true }], ...o });
  const inStudio = () => T('menu.why.inStudio');
  const impErr = (m) => { const e = document.querySelector('#impErr'); if (e) { e.textContent = m || ''; e.closest('.imp')?.scrollIntoView({ behavior: 'smooth', block: 'center' }); } };
  // the Windows dialog, then the import; « Ouvrir un projet… » then opens it in the studio
  async function menuPick(what, open) {
    impErr('');
    const r = await postJSON('/api/import/pick', { what });
    if (!r?.ok) { if (!r?.cancelled) impErr(r?.why ?? T('hub.import.noDialog')); return; }
    const imp = await postJSON('/api/import', { path: r.path });
    if (!imp?.ok) { impErr(imp?.why ?? T('hub.import.failed')); return; }
    const p = imp.project;
    if (open && (p.episode || p.video || p.kind === 'remotion')) { location.href = '/go/' + p.id; return; }
    last = ''; await load(true);
    document.querySelector(`.card[data-id="${p.id}"]`)?.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  async function showDoc(name, title) {
    const r = await fetch('/api/doc?name=' + name, { cache: 'no-store' }).catch(() => null);
    if (!r?.ok) { impErr(T('menu.doc.failed', { name })); return; }
    const text = await r.text();
    dlg({ title, text, pre: true, buttons: [{ label: T('menu.dlg.copy'), run: () => { navigator.clipboard?.writeText(text); return false; } }, { label: T('menu.dlg.close'), primary: true }] });
  }
  async function showAbout() {
    const a = await (await fetch('/api/about', { cache: 'no-store' })).json().catch(() => null) ?? {};
    const row = (k, v) => (v ? `<div class="row"><span class="lbl">${esc(k)}</span><span>${v}</span></div>` : '');
    const d = dlg({ title: T('menu.about'), html: `<p><b>Coulisses</b> ${esc(a.version ?? '')}</p><p>${esc(T('menu.about.what'))}</p>`
      + row(T('menu.about.version'), esc(a.version)) + row(T('menu.about.installed'), a.installed ? esc(day(a.installed)) : '') + row(T('menu.about.commit'), a.commit ? esc(`${a.commit}${a.branch ? ` (${a.branch})` : ''}`) : '')
      + row(T('menu.about.folder'), `${esc(a.folder ?? '')}${a.place === 'workshop' ? ` · ${esc(T('menu.about.workshop'))}` : ''}`)
      + row(T('menu.about.license'), esc(a.license)) + row(T('menu.about.source'), `<a href="#" id="mbRepo">${esc(String(a.url ?? '').replace(/^https:\/\//, ''))}</a>`) });
    d?.querySelector('#mbRepo')?.addEventListener('click', (e) => { e.preventDefault(); postJSON('/api/reveal', { what: 'online' }); });
  }
  function showPrefs() {
    const env = I18N.source === 'env';
    const d = dlg({ title: T('menu.prefs.title'), html: `<div class="row"><span class="lbl">${esc(T('menu.prefs.lang'))}</span>${(I18N.langs ?? ['fr', 'en']).map((l) => `<button data-l="${l}" class="${l === LANG ? 'on' : ''}">${esc(I18N.names?.[l] ?? l)}</button>`).join('')}</div>
      <p>${esc(env ? T('menu.prefs.envNote') : T('menu.prefs.langNote'))}</p>` });
    d?.querySelectorAll('[data-l]').forEach((b) => { b.disabled = env; b.onclick = () => setLanguage(b.dataset.l); });
  }
  async function showLog() { const t = await (await fetch('/api/log', { cache: 'no-store' })).text().catch(() => ''); dlg({ title: T('menu.logHub'), text: t || T('menu.empty'), pre: true }); }
  window.MenuBar?.mount($('#menubar'), [
    { id: 'file', label: T('menu.file'), items: [
      { id: 'home', label: T('menu.home'), disabled: () => T('menu.why.here') },
      { id: 'open', label: T('menu.open'), key: 'Ctrl+O', run: () => menuPick('project', true) },
      { id: 'importFolder', label: T('menu.importFolder'), run: () => menuPick('folder', false) },
      { id: 'importVideo', label: T('menu.importVideo'), run: () => menuPick('video', false) },
      { id: 'pastePath', label: T('menu.pastePath'), run: () => { const c = document.querySelector('.imp'); if (!c) return; c.classList.add('pasting'); c.scrollIntoView({ block: 'center' }); c.querySelector('#impPath').focus(); } },
      '-',
      { id: 'revealFolder', label: T('menu.revealFolder'), disabled: inStudio },
      { id: 'revealCoulisses', label: T('menu.revealCoulisses'), disabled: inStudio },
      '-',
      { id: 'close', label: T('menu.closeStudio'), disabled: inStudio },
    ] },
    { id: 'edit', label: T('menu.edit'), items: [
      { id: 'undo', label: T('menu.undo'), disabled: inStudio },
      { id: 'redo', label: T('menu.redo'), disabled: inStudio },
      '-',
      { id: 'copyLine', label: T('menu.copyLine'), disabled: inStudio },
      '-',
      { id: 'prefs', label: T('menu.prefs'), run: showPrefs },
    ] },
    { id: 'tools', label: T('menu.tools'), items: [
      { id: 'connect', label: T('menu.connect'), disabled: inStudio },
      { id: 'send', label: T('menu.send'), disabled: inStudio },
      '-',
      // the same entries as the studio's Tools menu (they act on the project open in a studio)
      { id: 'staging', label: T('menu.staging'), key: 'M', disabled: inStudio },
      { id: 'source', label: T('menu.source'), key: 'P', disabled: inStudio },
      { id: 'export', label: T('menu.export'), disabled: inStudio },
      { id: 'stopExport', label: T('menu.stopExport'), disabled: inStudio },
      { id: 'compare', label: T('menu.compare'), disabled: inStudio },
      '-',
      { id: 'updates', label: T('menu.updates'), disabled: inStudio },
      { id: 'verify', label: T('menu.verify'), disabled: inStudio },
      { id: 'log', label: T('menu.log'), items: () => [{ id: 'logHub', label: T('menu.logHub'), run: showLog }] },
    ] },
    { id: 'help', label: T('menu.help'), items: [
      { id: 'shortcuts', label: T('menu.shortcuts'), key: 'F1', disabled: () => T('menu.why.shortcutsStudio') },
      '-',
      { id: 'agentDoc', label: T('menu.agentDoc'), run: () => showDoc('agent', T('menu.agentDoc')) },
      { id: 'contract', label: T('menu.contract'), run: () => showDoc('contract', T('menu.contract')) },
      { id: 'online', label: T('menu.online'), run: () => postJSON('/api/reveal', { what: 'online' }) },
      '-',
      { id: 'about', label: T('menu.about'), run: showAbout },
    ] },
  ]);
  window.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && e.key.toLowerCase() === 'o') { e.preventDefault(); menuPick('project', true); }
    if (e.key === 'F1') e.preventDefault();
  });
  // File › Open a project… / Import… chosen in a studio: it comes back here (?menu=open|folder|video) to use the dialog
  const asked = new URLSearchParams(location.search).get('menu');
  if (asked) { history.replaceState(null, '', '/'); setTimeout(() => menuPick(asked === 'open' ? 'project' : asked === 'video' ? 'video' : 'folder', asked === 'open'), 400); }
  load();
})();
</script>
</body>
</html>
